# Map for WebSocket upgrades.
map $http_upgrade $connection_upgrade {

  default upgrade;
  ''      close;

}

# Real client IP when behind Cloudflare.
#   real_ip_header CF-Connecting-IP;
#   set_real_ip_from 173.245.48.0/20;
#   set_real_ip_from 103.21.244.0/22;
#   ... (add ALL Cloudflare IPv4/IPv6 ranges)
# include /etc/nginx/conf.d/cloudflare-real-ip.conf;

# HTTP: ACME + redirect to canonical HTTPS host.
server {

  listen 80;
  listen [::]:80;
  server_name  todo.trueog.net todo.true-og.net;

  # Let’s Encrypt HTTP-01 challenge (served on both names).
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  # Everything else: send to canonical HTTPS host.
  return 301 https://todo.true-og.net$request_uri;

}

# Canonical HTTPS vhost.
# Must match wekan ROOT_URL.
server {

  listen 443 ssl;
  #listen [::]:443 ssl;
  http2 on;

  server_name  todo.true-og.net;

  ssl_certificate     /etc/letsencrypt/live/trueog-combined/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trueog-combined/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Bigger uploads.
  client_max_body_size 100m;

  # Reverse proxy defaults for Meteor/Wekan.
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # Preserve original host/scheme so Meteor builds correct absolute URLs.
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;

  # Real client IP chain.
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

  # Timeouts / buffering for DDP and SockJS.
  proxy_connect_timeout 60s;
  proxy_read_timeout    3600s;
  proxy_send_timeout    3600s;
  proxy_buffering off;

  # Cache immutable hashed static assets that Wekan serves.
  location ~* \.(?:js|css|woff2?|ttf|svg|eot)$ {
    proxy_pass http://127.0.0.1:3001;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, must-revalidate";
  }

  # Be explicit about Meteor's realtime endpoints.
  location /sockjs/    { proxy_pass http://127.0.0.1:3001; }
  location /websocket  { proxy_pass http://127.0.0.1:3001; }

  # Everything else.
  location / {
    proxy_pass http://127.0.0.1:3001;

    # TrueOG 2026-11-11: WeKan signs in only through Staff-Auth and redirects there automatically
    # (OIDC_REDIRECTION_ENABLED), but only after its own sign-in page has drawn. This style keeps that page
    # (.auth-layout, which only the sign-in pages have) invisible for its first 3 seconds, so people go
    # straight to Staff-Auth; if the redirect did not happen, the "Sign in with Staff-Auth" button appears.
    # sub_filter needs the uncompressed page, hence Accept-Encoding "". A proxy_set_header here replaces every
    # server-level one, so they are all repeated (WebSocket upgrade, host/scheme, real client chain).
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding   "";
    sub_filter_once on;
    sub_filter '</head>' '<style>.auth-layout,.textBelowCustomLoginLogo{animation:trueogAuthShow 0s 3s both}@keyframes trueogAuthShow{from{visibility:hidden}to{visibility:visible}}</style></head>';
  }

}

# HTTPS vhost for the non-canonical domain -> redirect.
server {

  listen 443 ssl;
  #listen [::]:443 ssl;
  http2 on;

  server_name  todo.trueog.net;

  ssl_certificate     /etc/letsencrypt/live/trueog-combined/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trueog-combined/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://todo.true-og.net$request_uri;

}
